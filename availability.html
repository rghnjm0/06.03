{% extends "base.html" %}{% block title %}Доступность{% endblock %}{% block content %}<h1>Свободные номера</h1><form class="row g-2 mb-4"><div class="col-md-4"><input class="form-control" type="date" name="check_in" value="{{check_in}}" required></div><div class="col-md-4"><input class="form-control" type="date" name="check_out" value="{{check_out}}" required></div><div class="col-md-4"><button class="btn btn-primary">Проверить</button></div></form><div class="row g-3">{% for r in rooms %}<div class="col-md-4"><div class="card p-3"><h4>№{{r.number}}</h4><div>{{r.category.name}}</div><b>{{r.category.base_price}} ₽/ночь</b><div class="text-success">Свободен</div></div></div>{% else %}<p>Свободных номеров нет.</p>{% endfor %}</div>{% endblock %}
