{% extends "base.html" %}{% block title %}Гости{% endblock %}{% block content %}<h1>Гости</h1><div class="card p-3 mb-4"><form method="post" class="row g-2"><div class="col-md-2"><input class="form-control" name="first_name" placeholder="Имя" required></div><div class="col-md-2"><input class="form-control" name="last_name" placeholder="Фамилия" required></div><div class="col-md-2"><input class="form-control" name="phone" placeholder="Телефон"></div><div class="col-md-3"><input class="form-control" name="email" placeholder="Email"></div><div class="col-md-2"><input class="form-control" name="document" placeholder="Документ"></div><div class="col-md-1"><button class="btn btn-primary">+</button></div></form></div><table class="table"><tr><th>ФИО</th><th>Телефон</th><th>Email</th><th>Документ</th></tr>{% for g in guests %}<tr><td>{{g.last_name}} {{g.first_name}}</td><td>{{g.phone}}</td><td>{{g.email}}</td><td>{{g.document}}</td></tr>{% endfor %}</table>{% endblock %}
