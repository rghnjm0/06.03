{% extends "base.html" %}{% block title %}Тарифы{% endblock %}{% block content %}<h1>Тарифы</h1><div class="card p-3 mb-4"><form method="post" action="{{url_for('rooms.add_tariff')}}" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Название" required></div><div class="col-md-3"><select class="form-select" name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="price" type="number" step=".01" placeholder="Цена"></div><div class="col-md-2"><input class="form-control" name="season" value="Базовый"></div><div class="col-md-2"><button class="btn btn-primary w-100">Добавить</button></div></form></div><table class="table card"><tr><th>Название</th><th>Категория</th><th>Сезон</th><th>Цена</th></tr>{% for t in tariffs %}<tr><td>{{t.name}}</td><td>{{t.category.name}}</td><td>{{t.season}}</td><td>{{t.price}} ₽</td></tr>{% endfor %}</table>{% endblock %}
