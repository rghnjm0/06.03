{% extends "base.html" %}{% block title %}Номера{% endblock %}{% block content %}<h1>Номерной фонд</h1><div class="card p-3 mb-4"><form method="post" action="{{url_for('rooms.add')}}" class="row g-2"><div class="col-md-3"><input class="form-control" name="number" placeholder="Номер" required></div><div class="col-md-2"><input class="form-control" name="floor" type="number" value="1"></div><div class="col-md-4"><select class="form-select" name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="col-md-3"><button class="btn btn-primary w-100">Добавить номер</button></div></form></div><div class="row g-3">{% for r in rooms %}<div class="col-md-4"><div class="card p-3"><h3>№{{r.number}}</h3><p>{{r.category.name}} · этаж {{r.floor}}</p><span class="badge {% if r.status=='available' %}bg-success{% else %}bg-secondary{% endif %}">{{r.status}}</span><div class="mt-2">{{r.category.base_price}} ₽/ночь</div></div></div>{% endfor %}</div>{% endblock %}
