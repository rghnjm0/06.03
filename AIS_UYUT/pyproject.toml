[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
