{% extends 'base.html' %}{% block title %}Отзывы — номер {{room.Номер_Комнаты}}{% endblock %}{% block content %}<div class="container py-5"><h1>Отзывы о номере {{room.Номер_Комнаты}}</h1>{% for r in reviews %}<div class="card p-3 my-2"><strong>{{r.Имя}}</strong><div>⭐ {{r.Оценка}}/5</div><p class="mb-1">{{r.Текст}}</p><small class="text-muted">{{r.Создано}}</small></div>{% else %}<p>Отзывов пока нет.</p>{% endfor %}</div>{% endblock %}
