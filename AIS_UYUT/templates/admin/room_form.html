{% extends "admin/base_admin.html" %}
{% block page_title %}{{ 'Редактирование номера' if room else 'Новый номер' }}{% endblock %}
{% block admin_content %}
<div class="form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="row g-3"><div class="col-md-4"><label>Номер комнаты</label><input class="form-control" name="room_number" value="{{ room.Номер_Комнаты if room else '' }}" required></div><div class="col-md-8"><label>Категория</label><select class="form-select" name="category" required>{% for x in ['Стандарт','Стандарт Плюс','Полулюкс','Люкс','Апартаменты'] %}<option {% if room and room.Категория==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Вместимость</label><input class="form-control" type="number" min="1" name="capacity" value="{{ room.Вместимость if room else 2 }}" required></div><div class="col-md-4"><label>Цена за сутки</label><input class="form-control" type="number" min="1" step="100" name="price" value="{{ room.Цена_за_сутки if room else 3500 }}" required></div><div class="col-md-4"><label>Этаж</label><input class="form-control" type="number" min="1" name="floor" value="{{ room.Этаж if room else 1 }}" required></div></div><div class="form-actions"><a href="{{ url_for('admin_rooms') }}" class="btn btn-outline-secondary">Отмена</a><button class="btn btn-primary">Сохранить</button></div></form></div>
{% endblock %}
