{% extends "admin/base_admin.html" %}
{% block page_title %}Новое бронирование{% endblock %}
{% block admin_content %}
<div class="form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="row g-3"><div class="col-md-6"><label>Гость</label><select class="form-select" name="client_id" required>{% for c in clients %}<option value="{{ c.ID_Клиента }}">{{ c.Фамилия }} {{ c.Имя }} — {{ c.Телефон }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Номер</label><select class="form-select" name="room_id" required>{% for r in rooms %}<option value="{{ r.ID_Номера }}">№ {{ r.Номер_Комнаты }} · {{ r.Категория }} · {{ r.Цена_за_сутки|round(0) }} ₽</option>{% endfor %}</select></div><div class="col-md-4"><label>Заезд</label><input class="form-control" type="date" name="check_in" min="{{ today.strftime('%Y-%m-%d') }}" required></div><div class="col-md-4"><label>Выезд</label><input class="form-control" type="date" name="check_out" min="{{ today.strftime('%Y-%m-%d') }}" required></div><div class="col-md-4"><label>Гостей</label><input class="form-control" type="number" name="guests" min="1" value="1" required></div><div class="col-md-4"><label>Статус</label><select class="form-select" name="status"><option>Подтверждено</option><option>Заселен</option><option>Завершено</option><option>Отменено</option></select></div></div><div class="mt-4"><label class="mb-2">Дополнительные услуги</label><div class="row g-2">{% for service in services %}<div class="col-md-6"><label class="border rounded p-2 w-100"><input type="checkbox" name="services" value="{{ service.ID_Услуги }}"> {{ service.Название }} — {{ service.Цена|round(0) }} ₽</label></div>{% endfor %}</div></div><div class="form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('admin_bookings') }}">Отмена</a><button class="btn btn-primary">Создать бронирование</button></div></form></div>
{% endblock %}
