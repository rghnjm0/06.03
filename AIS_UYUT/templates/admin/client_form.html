{% extends "admin/base_admin.html" %}
{% block page_title %}{{ 'Редактирование гостя' if client else 'Новый гость' }}{% endblock %}
{% block admin_content %}
<div class="form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="row g-3"><div class="col-md-4"><label>Фамилия</label><input class="form-control" name="last_name" value="{{ client.Фамилия if client else '' }}" required></div><div class="col-md-4"><label>Имя</label><input class="form-control" name="first_name" value="{{ client.Имя if client else '' }}" required></div><div class="col-md-4"><label>Отчество</label><input class="form-control" name="middle_name" value="{{ client.Отчество if client else '' }}"></div><div class="col-md-4"><label>Телефон</label><input class="form-control" name="phone" value="{{ client.Телефон if client else '' }}" required></div><div class="col-md-4"><label>Дата рождения</label><input class="form-control" type="date" name="birth_date" value="{{ client.Дата_рождения if client else '' }}"></div><div class="col-md-4"><label>{{ 'Новый пароль (необязательно)' if client else 'Пароль' }}</label><input class="form-control" type="password" name="password" {% if not client %}required{% endif %}></div><div class="col-12"><label>Адрес</label><input class="form-control" name="address" value="{{ client.Адрес if client else '' }}"></div></div><div class="form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('admin_clients') }}">Отмена</a><button class="btn btn-primary">Сохранить</button></div></form></div>
{% endblock %}
