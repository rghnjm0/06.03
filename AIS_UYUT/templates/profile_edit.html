{% extends 'base.html' %}{% block title %}Профиль — Уют{% endblock %}{% block content %}<div class="container py-5"><div class="card p-4 mx-auto" style="max-width:700px"><h2>Редактирование профиля</h2><form method="post" class="row g-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="col-md-6"><label>Фамилия</label><input class="form-control" name="last_name" value="{{client.Фамилия}}" required></div><div class="col-md-6"><label>Имя</label><input class="form-control" name="first_name" value="{{client.Имя}}" required></div><div class="col-md-6"><label>Отчество</label><input class="form-control" name="middle_name" value="{{client.Отчество or ''}}"></div><div class="col-md-6"><label>Телефон</label><input class="form-control" name="phone" value="{{client.Телефон}}" required></div><div class="col-md-6"><label>Дата рождения</label><input class="form-control" type="date" name="birth_date" value="{{client.Дата_рождения or ''}}"></div><div class="col-12"><label>Адрес</label><input class="form-control" name="address" value="{{client.Адрес or ''}}"></div><div class="col-12"><button class="btn btn-primary">Сохранить</button><a class="btn btn-outline-secondary ms-2" href="{{url_for('profile')}}">Отмена</a></div></form></div></div>{% endblock %}
